<div class="payment-page">
  <header class="payment-header">
    <div class="payment-title-row" [class.is-pix-stage]="showPixStage()">
      <a
        [routerLink]="showPixStage() ? '/payment' : '/home'"
        class="payment-back-link"
        aria-label="Voltar">
        <img src="assets/icons/png/chevron-left-icon.png" alt="" aria-hidden="true" />
      </a>
      @if (!showPixStage()) {
        <h1 class="payment-title">Pagamento</h1>
      }
    </div>

    <div class="payment-mode-switch" role="group" aria-label="Modo de cobrança">
      <button
        type="button"
        class="payment-mode-btn"
        [class.is-active]="billingMode() === 'day'"
        (click)="onSetBillingMode('day')">
        Por dia (Calendário)
      </button>
      <button
        type="button"
        class="payment-mode-btn"
        [class.is-active]="billingMode() === 'hour'"
        (click)="onSetBillingMode('hour')">
        Por hora
      </button>
    </div>
  </header>

  @if (showPixStage()) {
    <app-pix-payment-card
      [amount]="finalTotal()"
      [pixCode]="pixCode()"
      (cancelConfirmed)="onCancelPix()">
    </app-pix-payment-card>
  } @else {
    <div class="payment-layout">
      <section class="payment-candidates-grid" aria-label="Garagens para pagamento">
        @for (item of candidates(); track item.id) {
          <app-payment-garage-card
            [booking]="item"
            [selected]="selectedBookingId() === item.id"
            (selectedChange)="onSelectCandidate($event)">
          </app-payment-garage-card>
        }
      </section>

      <app-payment-checkout
        [billingMode]="billingMode()"
        [selectedDays]="selectedDays()"
        [selectedHours]="selectedHours()"
        [calendarDays]="calendarDays"
        [weekDays]="weekDays"
        [paymentMethod]="paymentMethod()"
        [walletBalance]="walletBalance()"
        [baseSubtotal]="baseSubtotal()"
        [serviceFee]="serviceFee()"
        [discountAmount]="discountAmount()"
        [finalTotal]="finalTotal()"
        [payButtonVariant]="payButtonVariant()"
        [payButtonText]="payButtonText()"
        (billingModeChange)="onSetBillingMode($event)"
        (calendarDayToggled)="onToggleDay($event)"
        (reserveSpot)="onReserveSpot()"
        (hoursDecrement)="onDecrementHours()"
        (hoursIncrement)="onIncrementHours()"
        (paymentMethodChange)="onSelectPaymentMethod($event)"
        (paymentSubmitted)="onSubmitPayment()">
      </app-payment-checkout>
    </div>
  }

  <app-footer></app-footer>
</div>
