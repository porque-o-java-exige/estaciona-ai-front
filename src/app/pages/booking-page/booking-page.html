<div class="booking-page">
  <header class="booking-header">
    <div class="booking-title-row">
      <a routerLink="/home" class="booking-back-link" aria-label="Voltar para o início">
        <img src="assets/icons/png/chevron-left-icon.png" alt="" aria-hidden="true" />
      </a>
      <h1 class="booking-title">Reservas</h1>
    </div>

    <app-filter-tabs
      [options]="filterOptions"
      [activeOption]="activeFilter()"
      ariaLabel="Filtrar reservas por status"
      (optionSelected)="onSelectFilter($event)">
    </app-filter-tabs>
  </header>

  @if (bookings().length > 0) {
    <section class="booking-grid" aria-label="Lista de reservas">
      @for (item of bookings(); track item.id) {
        <app-booking-card
          [booking]="item"
          (cardSelect)="onSelectBooking($event)">
        </app-booking-card>
      }
    </section>
  } @else {
    <div class="booking-empty">
      <p>Nenhuma reserva encontrada neste filtro.</p>
    </div>
  }

  <app-footer></app-footer>
</div>
