<section class="reservas-page">
  <header class="page-header">
    <div class="header-titulo">
      <button type="button" class="btn-voltar" aria-label="Voltar">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h2 class="titulo-pagina">Reservas</h2>
    </div>
    
    <!-- Filtros por status -->
    <div class="filtros-container">
      <button 
        type="button" 
        class="filtro-btn" 
        [class.active]="filtroSelecionado() === 'TODAS'"
        (click)="selecionarFiltro('TODAS')">
        Todas
      </button>

      <button 
        type="button" 
        class="filtro-btn" 
        [class.active]="filtroSelecionado() === 'EM_ANDAMENTO'"
        (click)="selecionarFiltro('EM_ANDAMENTO')">
        Em andamento
      </button>

      <button 
        type="button" 
        class="filtro-btn" 
        [class.active]="filtroSelecionado() === 'CONCLUIDA'"
        (click)="selecionarFiltro('CONCLUIDA')">
        Concluídas
      </button>

      <button 
        type="button" 
        class="filtro-btn" 
        [class.active]="filtroSelecionado() === 'ATIVA'"
        (click)="selecionarFiltro('ATIVA')">
        Ativas
      </button>
    </div>
  </header>

  <!-- Listagem de Cards -->
  <div class="cards-grid">
    @for (reserva of reservasFiltradas(); track reserva.id) {
      <app-card-reserva [reserva]="reserva"></app-card-reserva>
    } @empty {
      <div class="lista-vazia">
        <p>Nenhuma reserva encontrada para este filtro.</p>
      </div>
    }
  </div>
</section>
