<article class="card-reserva">
  <header class="card-header">
    <div class="local-info">
      <h3 class="estacionamento">{{ reserva().estacionamento }}</h3>
      <span class="periodo">{{ reserva().data }} · {{ reserva().horario }}</span>
    </div>

    <!-- Reutilizando o componente Chip existente no projeto -->
    <app-chip 
      variant="status" 
      [text]="statusLabel()" 
      [isPendingOrDone]="isPendingOrDone()">
    </app-chip>
  </header>

  <main class="card-body">
    <div class="vaga-info">
      <div class="icon-container">
        <!-- Ícone do carro ou vaga -->
         <img src="assets/icons/car-icon.svg" alt="Car icon" class="car-icon" />        
      </div>
      <div class="detalhes-vaga">
        <span class="label">Vaga reservada</span>
        <strong class="identificacao">{{ reserva().vaga }} · {{ reserva().nivel }}</strong>
      </div>
    </div>

    <div class="pagamento-info">
      <span class="rotulo-pagamento">{{ reserva().rotuloPagamento }}</span>
      <strong class="valor">{{ reserva().valor | currency:'BRL':'symbol':'1.0-2' }}</strong>
    </div>
  </main>
</article>
