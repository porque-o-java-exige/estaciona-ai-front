<div class="chat-layout" [class.thread-open]="chatService.mobileThreadOpen()">
  <app-chat-conversation-list
    [conversations]="chatService.conversations()"
    [activeConversationId]="chatService.activeConversation().id"
    [class.thread-open]="chatService.mobileThreadOpen()"
    (conversationSelected)="onSelectConversation($event)">
  </app-chat-conversation-list>

  @if (chatService.activeConversation(); as activeConversation) {
    <app-chat-message-thread
      [conversation]="activeConversation"
      [class.thread-open]="chatService.mobileThreadOpen()"
      (backToList)="onBackToList()"
      (messageSent)="onSendMessage($event)">
    </app-chat-message-thread>
  }
</div>
