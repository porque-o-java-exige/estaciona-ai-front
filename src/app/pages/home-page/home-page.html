<div class="home-page">
  <section class="home-greeting">
    <p class="home-greeting-hello">Olá, {{ firstName() }}!</p>
    <h1 class="home-greeting-title">Onde vai estacionar hoje ?</h1>
  </section>

  <div class="home-mobile-tools">
    <app-input
      class="home-search"
      type="search"
      icon="search"
      placeholder="Buscar endereço, bairro..."
      [ngModel]="searchQuery()"
      (ngModelChange)="onSearch($event)">
    </app-input>
    <button type="button" class="home-tool-button" aria-label="Notificações">
      <img src="assets/icons/svg/notification-icon.svg" alt="" aria-hidden="true" />
    </button>
    <a routerLink="/list" class="home-tool-button" aria-label="Filtrar garagens">
      <img src="assets/icons/svg/filter-icon.svg" alt="" aria-hidden="true" />
    </a>
  </div>

  <app-garage-map></app-garage-map>

  <section class="home-nearby-section">
    <div class="home-nearby-header">
      <h2 class="home-nearby-title">
        Vagas mais próximas de acordo com seu endereço
      </h2>
      <a routerLink="/list" class="home-nearby-view-all">
        Ver catálogo completo
        <img src="assets/icons/png/chevron-left-icon.png" alt="" aria-hidden="true" />
      </a>
    </div>

    @if (garages().length > 0) {
      <div class="home-nearby-grid">
        @for (garage of garages(); track garage.id) {
          <app-garage-card
            [garage]="garage"
            [selected]="selectedGarageId() === garage.id"
            (cardClick)="onSelectGarage($event)">
          </app-garage-card>
        }
      </div>
    } @else {
      <div class="home-empty-state">
        <p>Nenhuma vaga encontrada para a busca atual.</p>
      </div>
    }
  </section>

  <app-footer></app-footer>
</div>
