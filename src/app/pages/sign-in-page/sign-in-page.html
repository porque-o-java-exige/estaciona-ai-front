<section class="auth-page">
  <div class="auth-mobile-logo">
    <app-logo size="md" linkTo="/sign-in"></app-logo>
  </div>

  <div class="auth-card">
    <div class="auth-desktop-logo">
      <app-logo size="lg" linkTo="/sign-in"></app-logo>
    </div>

    <form class="auth-form" (ngSubmit)="handleSubmit()" novalidate>
      @if (formError(); as error) {
        <p class="form-feedback" role="alert">{{ error }}</p>
      }

      <div class="auth-field">
        <label class="sr-only" for="email">E-mail</label>
        <app-input
          inputId="email"
          name="email"
          type="email"
          icon="email"
          autocomplete="username"
          enterkeyhint="next"
          [isRequired]="true"
          placeholder="meuexemplodeemail@email.com"
          hint="exemplo → meuexemplodeemail@email.com"
          [(ngModel)]="email">
        </app-input>
      </div>

      <div class="auth-field">
        <label class="sr-only" for="current-password">Senha</label>
        <app-input
          inputId="current-password"
          name="password"
          type="password"
          icon="password"
          autocomplete="current-password"
          enterkeyhint="done"
          [isRequired]="true"
          placeholder="**************"
          hint="exemplo → meuexemplodesenha123@"
          [(ngModel)]="password">
        </app-input>
      </div>

      <app-button
        variant="primary"
        buttonType="submit"
        [fullWidth]="true"
        text="Entrar">
      </app-button>

      <a routerLink="/sign-in" class="auth-link auth-forgot-link">
        Esqueceu a senha ?
      </a>
    </form>

    <div class="auth-social-section">
      <div class="auth-divider">
        <span class="auth-divider-bar"></span>
        <span class="auth-divider-text">Ou entre com:</span>
        <span class="auth-divider-bar"></span>
      </div>

      <app-button
        variant="google"
        buttonType="button"
        [fullWidth]="true"
        text="Continuar com o Google"
        (click)="handleGoogleSignIn()">
      </app-button>

      <a routerLink="/sign-up" class="auth-link auth-switch-link">
        Não tenho uma conta ainda
      </a>
    </div>
  </div>
</section>
