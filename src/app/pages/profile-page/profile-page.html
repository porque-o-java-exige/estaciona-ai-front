<div class="profile-layout">
  <div class="profile-container">
    <header class="profile-header">
      <nav class="breadcrumb" aria-label="Caminho da página">
        <span>Minha área</span>
        <img class="breadcrumb-chevron" src="assets/icons/png/chevron-left-icon.png" alt="" aria-hidden="true" />
        <strong class="breadcrumb-current">Perfil</strong>
      </nav>

      <div class="title-row">
        <div class="mobile-back-row">
          <a routerLink="/home" class="mobile-back-link" aria-label="Voltar para início">
            <img src="assets/icons/png/chevron-left-icon.png" alt="" aria-hidden="true" />
          </a>
          <h1 class="page-title">Perfil</h1>
        </div>
        <p class="page-subtitle">Sua conta, seus veículos e suas reservas em um só lugar.</p>
      </div>
    </header>

    @if (authService.currentUser(); as user) {
      <app-profile-overview
        [user]="user"
        [vehicleCount]="authService.vehicles().length"
        [garageCount]="authService.ownedGarages().length"
        (editProfile)="openEditModal()"
        (rechargeWallet)="openRechargeModal()">
      </app-profile-overview>
    }

    <app-profile-tabs-content (openEditProfile)="openEditModal()" />
  </div>
</div>

<dialog #editProfileDialog class="action-dialog" aria-labelledby="edit-profile-title">
  <form class="dialog-form" (ngSubmit)="submitEditProfile()" novalidate>
    <h3 id="edit-profile-title" class="dialog-title">Editar Perfil</h3>
    @if (editFormError(); as error) {
      <p class="form-feedback is-error" role="alert">{{ error }}</p>
    }
    <div class="dialog-field avatar-field">
      <span>Foto de perfil</span>
      <div class="avatar-edit-row">
        <img
          class="edit-avatar-preview"
          [src]="editAvatarUrl() ?? authService.currentUser().avatarUrl"
          [alt]="'Foto de ' + editName()" />
        <label class="avatar-upload-button">
          <span>Escolher foto</span>
          <input
            type="file"
            name="editAvatar"
            accept="image/*"
            aria-label="Escolher foto de perfil"
            (change)="onAvatarSelected($event)" />
        </label>
      </div>
    </div>
    <label class="dialog-field">
      <span>Nome completo</span>
      <input
        type="text"
        name="editName"
        required
        [ngModel]="editName()"
        (ngModelChange)="editName.set($event)" />
    </label>
    <label class="dialog-field">
      <span>E-mail</span>
      <input
        type="email"
        name="editEmail"
        required
        [ngModel]="editEmail()"
        (ngModelChange)="editEmail.set($event)" />
    </label>
    <label class="dialog-field">
      <span>Telefone</span>
      <input
        type="tel"
        name="editPhone"
        [ngModel]="editPhone()"
        (ngModelChange)="editPhone.set($event)" />
    </label>
    <div class="dialog-actions">
      <button type="button" class="btn-cancel" (click)="closeEditModal()">Cancelar</button>
      <button type="submit" class="btn-save">Salvar alterações</button>
    </div>
  </form>
</dialog>

<dialog #rechargeDialog class="action-dialog" aria-labelledby="recharge-title">
  <form class="dialog-form" (ngSubmit)="submitRecharge()" novalidate>
    <h3 id="recharge-title" class="dialog-title">Recarregar Carteira</h3>
    @if (rechargeFormError(); as error) {
      <p class="form-feedback is-error" role="alert">{{ error }}</p>
    }
    <label class="dialog-field">
      <span>Valor da recarga (R$)</span>
      <input
        type="number"
        name="rechargeAmount"
        min="5"
        step="5"
        required
        [ngModel]="rechargeAmount()"
        (ngModelChange)="rechargeAmount.set($event)" />
    </label>
    <div class="dialog-actions">
      <button type="button" class="btn-cancel" (click)="closeRechargeModal()">Cancelar</button>
      <button type="submit" class="btn-save">Confirmar recarga</button>
    </div>
  </form>
</dialog>
