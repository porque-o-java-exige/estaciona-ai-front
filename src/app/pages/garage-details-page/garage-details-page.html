<div class="garage-details-page">
  <div class="garage-details-back-row">
    <a routerLink="/list" class="garage-details-back-link" aria-label="Voltar para a lista de vagas">
      <app-button variant="back"></app-button>
    </a>
  </div>

  <app-garage-details
    [garage]="garage()"
    [spotsRemainingText]="spotsRemainingText()"
    [reviewsSubtext]="reviewsSubtext()"
    (openChat)="onOpenChat()"
    (addToBooking)="onAddToBooking()">
  </app-garage-details>

  <app-footer></app-footer>
</div>
