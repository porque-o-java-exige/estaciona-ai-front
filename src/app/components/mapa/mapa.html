<div class="app-screen-container">
  <!-- Cabeçalho e Busca (Conforme Figma) -->
  <div class="app-header">
    <div class="user-greeting">
      <span>Olá Rodraigo!</span>
      <h2>Onde vai estacionar hoje ?</h2>
    </div>

    <div class="search-bar-container">
      <div class="search-input-wrapper">
        <span class="icon">🔍</span>
        <input type="text" placeholder="Buscar endereço, bairro..." />
      </div>
      <button class="filter-btn" (click)="toggleTheme()" [title]="isDarkMode ? 'Modo Claro' : 'Modo Escuro'">
        {{ isDarkMode ? '☀️' : '🌙' }}
      </button>
    </div>
  </div>

  <!-- Wrapper do Mapa -->
  <div class="map-wrapper" [class.light-mode]="!isDarkMode">
    <div #mapContainer class="map-container"></div>
  </div>

  <!-- Barra de Navegação Inferior (Conforme Figma) -->
  <div class="bottom-nav">
    <button class="nav-item active">
      <span class="nav-icon">🏠</span>
      <span>Início</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">📅</span>
      <span>Reservas</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">💳</span>
      <span>Pagamento</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">💬</span>
      <span>Conversas</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">👤</span>
      <span>Perfil</span>
    </button>
  </div>
</div>
