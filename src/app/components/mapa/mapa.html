<div class="map-wrapper" [class.light-mode]="!isDarkMode">
  
  <!-- Controles Flutuantes (Canto Superior Direito) -->
  <div class="floating-controls">
    <button class="ctrl-btn" (click)="toggleTheme()" [title]="isDarkMode ? 'Modo Claro' : 'Modo Escuro'">
      {{ isDarkMode ? '☀️' : '🌙' }}
    </button>
    <button class="ctrl-btn" (click)="toggleLeftPanel()" title="Menu Lateral">
      📋
    </button>
  </div>

  <!-- Painel Lateral Esquerdo -->
  <div class="left-panel" [class.active]="isLeftPanelOpen">
    <div class="panel-content">
      <div class="panel-header">
        <h3>Painel do Mapa</h3>
        <button class="close-btn" (click)="toggleLeftPanel()">✕</button>
      </div>

      <div class="panel-card">
        <h4>Status do Sistema</h4>
        <p>Mapa carregado via OpenStreetMap e sincronizado com os temas da aplicação.</p>
      </div>
    </div>
  </div>

  <!-- Container do Mapa -->
  <div #mapContainer class="map-container"></div>
</div>
