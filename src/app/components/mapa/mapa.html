<div class="map-wrapper" [class.light-mode]="!isDarkMode">
  <!-- Referência do Angular (#mapContainer) em vez de ID estático -->
  <div #mapContainer class="map-container"></div>

  <!-- Botões Flutuantes de Ação -->
  <div class="floating-controls">
    <button type="button" class="ctrl-btn" (click)="toggleLeftPanel()" title="Abrir Indicadores">
      📊
    </button>
    <button type="button" class="ctrl-btn" (click)="toggleTheme()" title="Alternar Tema">
      {{ isDarkMode ? '☀️' : '🌙' }}
    </button>
  </div>

  <!-- Painel Lateral Esquerdo -->
  <aside class="left-panel" [class.active]="isLeftPanelOpen">
    <div class="panel-content">
      <div class="panel-header">
        <h3>Painel de Vagas & Indicadores</h3>
        <button type="button" class="close-btn" (click)="toggleLeftPanel()">✕</button>
      </div>

      <div class="panel-card">
        <h4>Status de Ocupação</h4>
        <p>Acompanhe o fluxo de vagas em tempo real.</p>
      </div>

      <div class="panel-card">
        <h4>Estacionamentos Próximos</h4>
        <p>Selecione um ponto no mapa para ver detalhes.</p>
      </div>
    </div>
  </aside>
</div>
