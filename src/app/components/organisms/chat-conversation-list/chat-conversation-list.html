<aside class="conversations-pane" aria-label="Lista de conversas">
  <header class="pane-header">
    <a routerLink="/home" class="conversation-back-link" aria-label="Voltar para o início">
      <img src="assets/icons/png/chevron-left-icon.png" alt="" aria-hidden="true" />
    </a>
    <h1 class="pane-title">Conversas</h1>
    <span class="count-badge">{{ conversations().length }}</span>
  </header>

  <div class="conversations-list" role="list">
    @for (conversation of conversations(); track conversation.id) {
      <button
        type="button"
        class="conversation-item"
        role="listitem"
        [class.active]="activeConversationId() === conversation.id"
        (click)="conversationSelected.emit(conversation.id)">
        <app-avatar
          [src]="conversation.avatarUrl"
          [alt]="conversation.contactName"
          [size]="48"
          [status]="conversation.status">
        </app-avatar>

        <div class="conv-content">
          <div class="conv-info">
            <strong class="contact-name">{{ conversation.contactName }}</strong>
            <p class="last-message">{{ conversation.lastMessage }}</p>
          </div>
          <span class="last-time">{{ conversation.lastTime }}</span>
        </div>

        @if (conversation.unreadCount > 0) {
          <span class="unread-badge" aria-label="Mensagens não lidas">
            {{ conversation.unreadCount }}
          </span>
        }
      </button>
    }
  </div>
</aside>
