<aside
  class="app-sidebar"
  [class.is-expanded]="isExpanded()"
  (mouseenter)="setExpanded(true)"
  (mouseleave)="setExpanded(false)"
  (focusin)="setExpanded(true)"
  (focusout)="onFocusOut($event)"
  aria-label="Menu lateral">
  <nav class="app-sidebar-nav" aria-label="Navegação principal">
    <ul class="app-sidebar-list" role="list">
      @for (item of navItems; track item.route) {
        <li class="app-sidebar-item">
          <a
            [routerLink]="item.route"
            routerLinkActive="app-sidebar-link-active"
            #rla="routerLinkActive"
            class="app-sidebar-link"
            [attr.data-tab]="item.id"
            [attr.aria-current]="rla.isActive ? 'page' : null"
            [attr.title]="item.label"
            [attr.aria-label]="item.label">
            <span class="app-sidebar-icon-box" aria-hidden="true">
              <img [src]="item.icon" alt="" class="app-sidebar-icon" />
              @if (item.badgeColor) {
                <span
                  class="app-sidebar-badge"
                  [class.app-sidebar-badge-yellow]="item.badgeColor === 'yellow'"
                  [class.app-sidebar-badge-red]="item.badgeColor === 'red'">
                </span>
              }
            </span>
            <span class="app-sidebar-label">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</aside>
