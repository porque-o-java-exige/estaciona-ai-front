<div class="chip" [class]="'chip-' + variant()" [class.is-active]="isReservationFilterActive()" [class.is-pending-or-done]="isPendingOrDone()">
    @for (path of iconPaths(); track $index) {
    <img [src]="path" alt="" aria-hidden="true" />
    }

    <p>{{ text() }}</p>
    @if(subtext()) {
        <span>{{ subtext() }}</span>
    }
</div>
