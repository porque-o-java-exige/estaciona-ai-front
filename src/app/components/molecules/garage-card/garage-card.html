<a
  class="garage-card"
  [class.is-selected]="selected()"
  [routerLink]="['/list/details']"
  [queryParams]="{ id: garage().id }"
  (click)="onSelectCard()"
  [attr.aria-label]="'Ver detalhes de ' + garage().name">
  <app-image
    class="garage-card-image"
    [src]="garage().imageUrl"
    [alt]="garage().name"
    loading="lazy"
    [width]="90"
    [height]="90">
  </app-image>

  <div class="garage-card-content">
    <div class="garage-card-header">
      <div class="garage-card-titles">
        <h3 class="garage-card-title">{{ garage().name }}</h3>
        <p class="garage-card-address">{{ garage().address }}</p>
      </div>

      <app-chip
        variant="availability"
        [tone]="garage().availabilityLevel"
        [text]="spotsLabel()">
      </app-chip>
    </div>

    <div class="garage-card-footer">
      <div class="garage-card-meta">
        <app-icon name="star" [size]="13"></app-icon>
        <span class="garage-card-meta-text">{{ metaSummary() }}</span>
      </div>

      <app-price
        class="garage-card-price"
        [amount]="garage().hourlyPrice"
        suffix="/h">
      </app-price>
    </div>
  </div>
</a>
