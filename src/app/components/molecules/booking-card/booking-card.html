<a
  class="booking-card"
  [routerLink]="['/payment']"
  [queryParams]="{ bookingId: booking().id }"
  (click)="onCardClick()"
  [attr.aria-label]="'Gerenciar reserva em ' + booking().address">
  <div class="booking-card-top" [class]="headerToneClass()">
    <div class="booking-card-location">
      <h3 class="booking-card-title">{{ booking().address }}</h3>
      <p class="booking-card-datetime">{{ booking().dateTimeRange }}</p>
    </div>

    <app-chip
      variant="status"
      [text]="booking().status"
      [isPendingOrDone]="isPendingOrDone()">
    </app-chip>
  </div>

  <div class="booking-card-bottom">
    <div class="booking-card-spot-group">
      <div class="booking-card-icon-box" aria-hidden="true">
        <app-icon name="vehicle" [size]="18"></app-icon>
      </div>

      <div class="booking-card-spot-info">
        <span class="booking-card-spot-label">Vaga reservada</span>
        <strong class="booking-card-spot-code">{{ booking().spotCode }}</strong>
      </div>
    </div>

    <div class="booking-card-price-group">
      <span class="booking-card-price-label">{{ totalLabel() }}</span>
      <app-price
        class="booking-card-price-value"
        [amount]="booking().totalAmount"
        currency="R$ ">
      </app-price>
    </div>
  </div>
</a>
